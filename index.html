
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5efe7">
<title>My Life Planner</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5efe7;color:#51483f;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{padding:28px 20px 15px}
h1{font-family:Georgia,serif;font-size:32px;font-weight:normal;margin:0}
.sub{color:#988879;font-size:13px;margin-top:6px}
main{padding:10px 18px 100px;max-width:650px;margin:auto}
h2{font-family:Georgia,serif;font-size:23px;font-weight:normal}
.card{background:#fffaf4;border-radius:18px;padding:17px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#fffaf4;padding:16px;border-radius:16px}
.stat b{display:block;font-size:21px;margin-top:9px}
button{border:0;border-radius:12px;padding:12px;background:#e9ded1;color:#51483f;font-size:14px;cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;background:#fffaf4;display:flex;justify-content:space-around;padding:12px 3px max(12px,env(safe-area-inset-bottom));box-shadow:0 -3px 15px #51483f12}
nav button{background:transparent;padding:8px 4px;font-size:12px}
input{border:1px solid #e5d9cb;background:white;padding:12px;border-radius:10px;width:100%;margin:7px 0;color:#51483f}
.task{padding:12px 0;border-bottom:1px solid #eee5da}
.task input{width:auto;margin-right:9px}
.page{display:none}.page.active{display:block}
</style>
</head>
<body>
<header>
<h1>My Life ♡</h1>
<div class="sub" id="date"></div>
</header>
<main>
<section class="page active" id="home">
<div class="card">
<h2>Добро пожаловать ☀️</h2>
<p>Твоя жизнь — твой собственный проект.</p>
</div>
<div class="grid">
<div class="stat">☑️ Задачи<b id="taskCount">0</b></div>
<div class="stat">🌷 Привычки<b>0</b></div>
<div class="stat">💧 Вода<b>0 мл</b></div>
<div class="stat">✨ Настроение<b>♡</b></div>
</div>
<div class="card">
<h2>План на сегодня</h2>
<div id="todayTasks">Пока нет задач</div>
</div>
<div class="card">
<h2>Мой фокус дня</h2>
<input placeholder="Что сегодня главное?">
</div>
</section>

<section class="page" id="tasks">
<h2>Мои задачи ☑️</h2>
<div class="card">
<input id="taskInput" placeholder="Добавить задачу">
<button onclick="addTask()">+ Добавить</button>
<div id="taskList"></div>
</div>
</section>

<section class="page" id="calendar">
<h2>Календарь 📅</h2>
<div class="card">
<input type="date" id="eventDate">
<input id="eventName" placeholder="Название события">
<button onclick="addEvent()">Добавить событие</button>
<div id="events"></div>
</div>
</section>

<section class="page" id="habits">
<h2>Мои привычки 🌷</h2>
<div class="card" id="habitList"></div>
</section>

<section class="page" id="finance">
<h2>Мои финансы 💰</h2>
<div class="card">
<input type="number" id="expense" placeholder="Сумма расхода">
<input id="category" placeholder="Категория">
<button onclick="addExpense()">Добавить расход</button>
<h3>Расходы: <span id="total">0</span> ₽</h3>
<div id="expenseList"></div>
</div>
</section>

<section class="page" id="notes">
<h2>Мои заметки 📝</h2>
<div class="card">
<textarea id="note" placeholder="Запиши свои мысли..." style="width:100%;height:130px;border:0;background:transparent;color:#51483f"></textarea>
<button onclick="saveNote()">Сохранить заметку</button>
<div id="savedNotes"></div>
</div>
</section>
</main>
<nav>
<button onclick="show('home')">🏠<br>Главная</button>
<button onclick="show('tasks')">☑️<br>Задачи</button>
<button onclick="show('calendar')">📅<br>Календарь</button>
<button onclick="show('habits')">🌷<br>Привычки</button>
<button onclick="show('finance')">💰<br>Финансы</button>
<button onclick="show('notes')">📝<br>Заметки</button>
</nav>
<script>
const $=id=>document.getElementById(id);
const get=k=>JSON.parse(localStorage.getItem(k)||'[]');
const put=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
$('date').textContent=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));$(id).classList.add('active')}
function renderTasks(){
let tasks=get('tasks');
$('taskList').innerHTML=tasks.map((t,i)=>`<div class="task"><label><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${i})">${t.name}</label><button onclick="deleteTask(${i})">×</button></div>`).join('');
$('todayTasks').textContent=tasks.filter(t=>!t.done).map(t=>t.name).join(' · ')||'Все задачи выполнены!';
$('taskCount').textContent=tasks.filter(t=>!t.done).length;
}
function addTask(){let v=$('taskInput').value.trim();if(!v)return;let a=get('tasks');a.push({name:v,done:false});put('tasks',a);$('taskInput').value='';renderTasks()}
function toggleTask(i){let a=get('tasks');a[i].done=!a[i].done;put('tasks',a);renderTasks()}
function deleteTask(i){let a=get('tasks');a.splice(i,1);put('tasks',a);renderTasks()}
function renderHabits(){
let a=get('habits');
$('habitList').innerHTML=a.map((h,i)=>`<div class="task"><label><input type="checkbox" ${h.done?'checked':''} onchange="toggleHabit(${i})">${h.name}</label></div>`).join('')+'<input id="habitInput" placeholder="Новая привычка"><button onclick="addHabit()">Добавить</button>';
}
function addHabit(){let v=$('habitInput').value.trim();if(!v)return;let a=get('habits');a.push({name:v,done:false});put('habits',a);renderHabits()}
function toggleHabit(i){let a=get('habits');a[i].done=!a[i].done;put('habits',a);renderHabits()}
function addEvent(){let a=get('events');a.push({date:$('eventDate').value,name:$('eventName').value});put('events',a);renderEvents()}
function renderEvents(){$('events').innerHTML=get('events').map(e=>`<div class="task">${e.date} — ${e.name}</div>`).join('')}
function addExpense(){let a=get('expenses');let sum=Number($('expense').value);if(!sum)return;a.push({sum,category:$('category').value});put('expenses',a);renderExpenses()}
function renderExpenses(){let a=get('expenses');$('total').textContent=a.reduce((s,e)=>s+e.sum,0).toLocaleString('ru-RU');$('expenseList').innerHTML=a.map(e=>`<div class="task">${e.category||'Расход'} — ${e.sum} ₽</div>`).join('')}
function saveNote(){let a=get('notes');if(!$('note').value.trim())return;a.push($('note').value);put('notes',a);$('note').value='';renderNotes()}
function renderNotes(){$('savedNotes').innerHTML=get('notes').map(n=>`<div class="task">${n}</div>`).join('')}
renderTasks();renderHabits();renderEvents();renderExpenses();renderNotes();
</script>
</body>
</html>
